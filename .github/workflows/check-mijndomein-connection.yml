name: Check MijnDomein connection
on:
  push:
    branches: [main]
    paths: [.github/workflows/check-mijndomein-connection.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check hosting connectivity without logging credentials
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import socket
          import time
          host = os.environ["FTP_SERVER"]
          print(json.dumps({"configured_host_matches_plesk": host == "server042.mijndomeinhosting.nl"}))
          for family, label in [(socket.AF_INET, "IPv4"), (socket.AF_INET6, "IPv6")]:
              try:
                  addresses = socket.getaddrinfo(host, 21, family, socket.SOCK_STREAM)
              except OSError:
                  print(json.dumps({"family": label, "dns": "unavailable"}))
                  continue
              print(json.dumps({"family": label, "dns": "ok",
                                "matches_plesk_ip": any(a[4][0] in ["213.249.67.52", "2a01:448:2001::52"] for a in addresses)}))
              for port in [21, 443]:
                  connected = False
                  started = time.monotonic()
                  for _, kind, protocol, _, address in addresses[:2]:
                      target = (address[0], port) if family == socket.AF_INET else (address[0], port, 0, 0)
                      try:
                          with socket.socket(family, kind, protocol) as connection:
                              connection.settimeout(8)
                              connection.connect(target)
                              connected = True
                              break
                      except OSError:
                          pass
                  print(json.dumps({"family": label, "port": port, "connected": connected,
                                    "seconds": round(time.monotonic()-started, 1)}))
          PY
